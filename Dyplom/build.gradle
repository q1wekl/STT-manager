plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'io.github.goooler.shadow' version '8.1.8'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

javafx {
    version = "21"
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

tasks.withType(JavaExec) {
    systemProperty "file.encoding", "UTF-8"
}

dependencies {
    implementation 'org.openjfx:javafx-controls:21'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'com.github.wendykierp:JTransforms:3.1'
    implementation 'io.github.givimad:whisper-jni:1.7.1'
    implementation 'org.openjfx:javafx-fxml:21'
}

application {
    mainClass = 'app.Launcher'
}

shadowJar {
    archiveBaseName = 'AudioEditingManager'
    archiveVersion = ''
    archiveClassifier = ''
    manifest {
        attributes 'Main-Class': 'app.Launcher'
    }
    mergeServiceFiles()
}

task packageApp(type: Exec, dependsOn: shadowJar) {
    doFirst {
        delete 'dist/AudioEditingManager'
    }
    commandLine "${projectDir}/liberica-jdk/bin/jpackage",
            '--input', 'build/libs',
            '--main-jar', 'AudioEditingManager.jar',
            '--name', 'AudioEditingManager',
            '--app-version', '1.0',
            '--type', 'app-image',
            '--dest', 'dist',
            '--java-options', '--enable-native-access=ALL-UNNAMED'
}